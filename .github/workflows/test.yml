name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: waveycord
          POSTGRES_PASSWORD: waveycord
          POSTGRES_DB: waveycord_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U waveycord -d waveycord_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: vet
        run: go vet ./...
      - name: sqlite suite
        run: go test ./... -timeout 240s
      - name: postgres suite
        env:
          WAVEYCORD_TEST_DSN: postgres://waveycord:waveycord@127.0.0.1:5432/waveycord_test?sslmode=disable
          WAVEYCORD_TEST_REPLICA_DSN: postgres://waveycord:waveycord@127.0.0.1:5432/waveycord_test?sslmode=disable
        run: go test ./... -timeout 240s
      - name: static postgres build
        run: CGO_ENABLED=0 go build -tags nosqlite ./...
